
# Database (from env variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/learning_scheduler?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${APP_JWT_SECRET:ReplaceThisWithASecretKeyForJWTSigning}
app.jwt.expirationMs=${APP_JWT_EXPIRATION_MS:86400000}

# Twilio (set these in env for real SMS)
twilio.accountSid=${TWILIO_ACCOUNT_SID:}
twilio.authToken=${TWILIO_AUTH_TOKEN:}
twilio.fromNumber=${TWILIO_FROM_NUMBER:+1234567890}

server.port=${PORT:8080}
